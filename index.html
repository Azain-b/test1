<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Infinite Board</title>
<meta name="description" content="Бесконечная интерактивная доска: стикеры, фигуры, стрелки и рисование.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15161b" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --canvas: #f7f7f5; --dot: #d6d8de; --surface: #ffffff; --ink: #0f1020; --muted: #6b6e80;
    --line: rgba(15,16,32,.1); --accent: #ffd02f; --sel: #4262ff; --hover: rgba(15,16,32,.06);
    --shadow: 0 1px 2px rgba(15,16,32,.08), 0 8px 24px rgba(15,16,32,.12);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --canvas: #15161b; --dot: #2c2e37; --surface: #20222a; --ink: #ececf1; --muted: #9a9db0;
    --line: rgba(255,255,255,.1); --sel: #7b92ff; --hover: rgba(255,255,255,.08);
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.4); color-scheme: dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) {
      --canvas: #15161b; --dot: #2c2e37; --surface: #20222a; --ink: #ececf1; --muted: #9a9db0;
      --line: rgba(255,255,255,.1); --sel: #7b92ff; --hover: rgba(255,255,255,.08);
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.4); color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--canvas); color: var(--ink);
    font: 500 13px/1.4 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; touch-action: manipulation; }
  :focus-visible { outline: 2px solid var(--sel); outline-offset: 2px; }

  #stage { position: fixed; inset: 0; touch-action: none; user-select: none; -webkit-user-select: none; overflow: hidden;
    background-color: var(--canvas);
    background-image: radial-gradient(circle, var(--dot) 1.2px, transparent 1.4px);
    background-size: var(--gs, 24px) var(--gs, 24px); background-position: var(--gx, 0) var(--gy, 0); cursor: default; }
  #stage[data-tool="hand"] { cursor: grab; }
  #stage.panning { cursor: grabbing; }
  #stage[data-tool="sticky"], #stage[data-tool="text"], #stage[data-tool="rect"], #stage[data-tool="ellipse"],
  #stage[data-tool="pen"], #stage[data-tool="arrow"] { cursor: crosshair; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #vec { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
  #vec .hit { pointer-events: stroke; }

  .item { position: absolute; display: flex; align-items: center; justify-content: center; text-align: center;
    color: #0f1020; padding: 12px; word-break: break-word; }
  .item .txt { outline: none; width: 100%; white-space: pre-wrap; min-height: 1.3em; cursor: inherit; }
  .item.sticky { align-items: flex-start; justify-content: flex-start; text-align: left; font-size: 18px; line-height: 1.35;
    padding: 16px; border-radius: 4px; box-shadow: 0 1px 1px rgba(0,0,0,.08), 0 6px 14px rgba(0,0,0,.12); }
  .item.rect, .item.ellipse { border: 2px solid #0f1020; font-size: 16px; }
  .item.rect { border-radius: 6px; }
  .item.ellipse { border-radius: 50%; }
  .item.text { font-size: 24px; color: var(--ink); justify-content: flex-start; text-align: left; padding: 4px 6px; }
  .item.editing { cursor: text; }

  #sel { position: absolute; left: 0; top: 0; pointer-events: none; }
  .selbox { position: absolute; border: calc(1.5px / var(--z, 1)) solid var(--sel); pointer-events: none; }
  .selbox.group { border-style: dashed; }
  .handle { position: absolute; width: calc(10px / var(--z, 1)); height: calc(10px / var(--z, 1)); background: var(--surface);
    border: calc(1.5px / var(--z, 1)) solid var(--sel); right: calc(-5px / var(--z, 1)); bottom: calc(-5px / var(--z, 1));
    pointer-events: auto; cursor: nwse-resize; border-radius: 2px; }
  #marquee { position: fixed; border: 1px solid var(--sel); background: color-mix(in srgb, var(--sel) 12%, transparent); display: none; pointer-events: none; }

  .panel { position: fixed; background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); border: 1px solid var(--line); z-index: 10; }
  #tools { left: 16px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 2px; padding: 6px; }
  .tool { position: relative; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 8px; color: var(--ink);
    transition: background-color .12s, transform .12s; }
  .tool:hover { background: var(--hover); }
  .tool[aria-pressed="true"] { background: var(--accent); color: #0f1020; }
  .tool svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tool .tip { position: absolute; left: 48px; white-space: nowrap; background: var(--ink); color: var(--canvas); padding: 4px 8px; border-radius: 6px;
    font-size: 12px; opacity: 0; transform: translateX(-4px); pointer-events: none; transition: opacity .12s, transform .12s; }
  .tool:hover .tip, .tool:focus-visible .tip { opacity: 1; transform: none; }
  .sep { height: 1px; background: var(--line); margin: 4px 6px; }

  #ctx { display: none; align-items: center; justify-content: center; flex-wrap: wrap; gap: 4px; padding: 6px; transform: translate(-50%, -100%); width: max-content; max-width: min(380px, calc(100vw - 16px)); }
  #ctx.show { display: flex; }
  #ctx .tg { display: none; align-items: center; gap: 2px; flex-basis: 100%; justify-content: center; padding-top: 4px; border-top: 1px solid var(--line); }
  #ctx.has-text .tg { display: flex; }
  .ctxbtn[aria-pressed="true"] { background: var(--accent); color: #0f1020; }
  .ctxbtn.tx { font-weight: 700; font-size: 14px; width: 30px; }
  .sizeval { min-width: 30px; text-align: center; font-variant-numeric: tabular-nums; color: var(--muted); }
  #themeBtn { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; margin-left: 4px; }
  #themeBtn:hover { background: var(--hover); }
  #themeBtn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .sw { width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; box-shadow: inset 0 0 0 1px rgba(0,0,0,.2); }
  .sw[aria-pressed="true"] { border-color: var(--surface); outline: 2px solid var(--sel); }
  .ctxbtn { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; }
  .ctxbtn:hover { background: var(--hover); }
  .ctxbtn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  #bar { right: 16px; bottom: 16px; display: flex; align-items: center; padding: 4px; gap: 2px; }
  #bar button { min-width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; padding: 0 6px; transition: background-color .12s; }
  #bar button:hover:not(:disabled) { background: var(--hover); }
  #bar button:disabled { opacity: .35; cursor: default; }
  #bar svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #zoomLabel { min-width: 52px !important; font-variant-numeric: tabular-nums; }

  #brand { left: 16px; top: 16px; display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 8px; }
  #brand .logo { width: 24px; height: 24px; border-radius: 6px; background: var(--accent); display: grid; place-items: center; }
  #brand .logo svg { width: 14px; height: 14px; stroke: #0f1020; fill: none; stroke-width: 2.2; stroke-linecap: round; }
  #brand b { font-weight: 600; font-size: 14px; text-wrap: balance; }
  #hint { left: 16px; bottom: 16px; padding: 8px 12px; color: var(--muted); font-size: 12px; max-width: min(340px, calc(100vw - 200px)); }
  #hint kbd { font: inherit; background: var(--hover); padding: 0 5px; border-radius: 4px; color: var(--ink); }

  #toast { position: fixed; left: 50%; bottom: 72px; transform: translate(-50%, 8px); background: var(--ink); color: var(--canvas);
    padding: 8px 14px; border-radius: 8px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 20; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 640px) {
    #tools { left: 50%; top: auto; bottom: 16px; transform: translateX(-50%); flex-direction: row; max-width: calc(100vw - 16px); overflow-x: auto; }
    .sep { width: 1px; height: auto; margin: 6px 4px; }
    .tool .tip { display: none; }
    #bar { bottom: 80px; right: 8px; } #hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition-duration: .01ms !important; } }
</style>
</head>
<body>
<div id="stage" data-tool="select" role="application" aria-label="Бесконечная доска">
  <div id="world">
    <svg id="vec" aria-hidden="true"></svg>
    <div id="items"></div>
    <div id="sel"></div>
  </div>
</div>
<div id="marquee"></div>

<div class="panel" id="brand"><span class="logo"><svg viewBox="0 0 16 16"><path d="M2 12 L6 4 L10 10 L14 3"/></svg></span><b>Infinite Board</b><button id="themeBtn" aria-label="Сменить тему" title="Сменить тему (D)"></button></div>

<nav class="panel" id="tools" aria-label="Инструменты"></nav>

<div class="panel" id="ctx" role="toolbar" aria-label="Свойства объекта"></div>

<div class="panel" id="bar" role="toolbar" aria-label="Масштаб и история">
  <button id="undo" aria-label="Отменить (Ctrl+Z)" title="Отменить (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
  <button id="redo" aria-label="Повторить (Ctrl+Shift+Z)" title="Повторить (Ctrl+Shift+Z)"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
  <span class="sep" style="width:1px;height:20px;margin:0 4px"></span>
  <button id="zoomOut" aria-label="Уменьшить" title="Уменьшить (−)"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
  <button id="zoomLabel" aria-label="Сбросить масштаб до 100%" title="Сбросить масштаб (Shift+0)">100%</button>
  <button id="zoomIn" aria-label="Увеличить" title="Увеличить (+)"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button id="fit" aria-label="Показать всё (Shift+1)" title="Показать всё (Shift+1)"><svg viewBox="0 0 24 24"><path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"/></svg></button>
</div>

<div class="panel" id="hint"><kbd>Пробел</kbd> + drag — двигать · <kbd>Ctrl</kbd> + колесо — масштаб · двойной клик или <kbd>Enter</kbd> — текст · <kbd>D</kbd> — тема</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const stage = $('#stage'), world = $('#world'), vec = $('#vec'), itemsEl = $('#items'), selEl = $('#sel');
const SVGNS = 'http://www.w3.org/2000/svg';
const COLORS = ['#ffe066', '#ff9ec7', '#a8e6a3', '#9cd3ff', '#ffb870', '#c9b6ff', 'ink'];
const STORE = 'infinite-board.v1';
const ICONS = {
  select: '<path d="M5 3l14 7-6 2-2 6z"/>',
  hand: '<path d="M8 12V5a1.5 1.5 0 0 1 3 0v6m0-1V4a1.5 1.5 0 0 1 3 0v7m0-5a1.5 1.5 0 0 1 3 0v8a6 6 0 0 1-6 6h-1a6 6 0 0 1-4.5-2L4 14.5a1.6 1.6 0 0 1 2.4-2L8 14"/>',
  sticky: '<path d="M4 4h16v10l-6 6H4z"/><path d="M14 20v-6h6"/>',
  text: '<path d="M5 6V4h14v2M12 4v16M9 20h6"/>',
  rect: '<rect x="4" y="5" width="16" height="14" rx="2"/>',
  ellipse: '<ellipse cx="12" cy="12" rx="9" ry="7"/>',
  arrow: '<path d="M4 20 20 4M10 4h10v10"/>',
  pen: '<path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/>',
};
const TOOLS = [
  ['select', 'Выбрать', 'V'], ['hand', 'Рука', 'H'], null,
  ['sticky', 'Стикер', 'S'], ['text', 'Текст', 'T'], ['rect', 'Прямоугольник', 'R'], ['ellipse', 'Эллипс', 'O'],
  ['arrow', 'Стрелка', 'A'], ['pen', 'Карандаш', 'P'],
];

/* ---------- state ---------- */
let items = [];
let sel = new Set();
let view = { x: 0, y: 0, z: 1 };
let tool = 'select';
let undoStack = [], redoStack = [];
let spaceDown = false;
let editingId = null;
const els = new Map();
let seq = 0;
const uid = () => 'i' + Date.now().toString(36) + (seq++).toString(36);
const byId = id => items.find(i => i.id === id);
const colorOf = c => (c === 'ink' ? 'var(--ink)' : c);

/* ---------- persistence & history ---------- */
let saveT;
function save() {
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    try { localStorage.setItem(STORE, JSON.stringify({ items, view })); } catch (e) { /* storage unavailable */ }
  }, 250);
}
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(STORE) || 'null');
    if (d && Array.isArray(d.items)) { items = d.items; view = d.view || view; return true; }
  } catch (e) { /* ignore */ }
  return false;
}
function snapshot() { return JSON.stringify(items); }
function pushUndo() { undoStack.push(snapshot()); if (undoStack.length > 100) undoStack.shift(); redoStack = []; updateHistoryBtns(); }
function restore(s) { items = JSON.parse(s); sel = new Set([...sel].filter(id => byId(id))); draw(); save(); updateHistoryBtns(); }
function undo() { if (!undoStack.length) return; redoStack.push(snapshot()); restore(undoStack.pop()); }
function redo() { if (!redoStack.length) return; undoStack.push(snapshot()); restore(redoStack.pop()); }
function updateHistoryBtns() { $('#undo').disabled = !undoStack.length; $('#redo').disabled = !redoStack.length; }

/* ---------- geometry ---------- */
const toWorld = (sx, sy) => ({ x: (sx - view.x) / view.z, y: (sy - view.y) / view.z });
function endpoint(it, which) {
  const p = it[which], other = it[which === 'a' ? 'b' : 'a'];
  if (!p.id) return { x: p.x, y: p.y };
  const t = byId(p.id);
  if (!t) return { x: p.x, y: p.y };
  const o = other.id && byId(other.id) ? center(byId(other.id)) : { x: other.x, y: other.y };
  return edgePoint(t, o.x, o.y);
}
const center = it => ({ x: it.x + it.w / 2, y: it.y + it.h / 2 });
function edgePoint(it, tx, ty) {
  const c = center(it), dx = tx - c.x, dy = ty - c.y;
  if (!dx && !dy) return c;
  const hw = it.w / 2 + 4, hh = it.h / 2 + 4;
  let s;
  if (it.type === 'ellipse') s = 1 / Math.sqrt((dx * dx) / (hw * hw) + (dy * dy) / (hh * hh));
  else s = Math.min(dx ? hw / Math.abs(dx) : Infinity, dy ? hh / Math.abs(dy) : Infinity);
  return { x: c.x + dx * s, y: c.y + dy * s };
}
function bbox(it) {
  if (it.type === 'pen') {
    let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
    for (const [x, y] of it.pts) { x1 = Math.min(x1, x); y1 = Math.min(y1, y); x2 = Math.max(x2, x); y2 = Math.max(y2, y); }
    return { x: x1, y: y1, w: x2 - x1, h: y2 - y1 };
  }
  if (it.type === 'arrow') {
    const a = endpoint(it, 'a'), b = endpoint(it, 'b');
    return { x: Math.min(a.x, b.x), y: Math.min(a.y, b.y), w: Math.abs(a.x - b.x), h: Math.abs(a.y - b.y) };
  }
  return { x: it.x, y: it.y, w: it.w, h: it.h };
}
function moveItem(it, dx, dy) {
  if (it.type === 'pen') it.pts = it.pts.map(([x, y]) => [x + dx, y + dy]);
  else if (it.type === 'arrow') { for (const k of ['a', 'b']) if (!it[k].id) { it[k].x += dx; it[k].y += dy; } }
  else { it.x += dx; it.y += dy; }
}

/* ---------- rendering ---------- */
function mkEl(it) {
  let el;
  if (it.type === 'pen' || it.type === 'arrow') {
    el = document.createElementNS(SVGNS, 'g');
    el.dataset.id = it.id;
    el.classList.add('vecitem');
    el.innerHTML = '<path class="hit" fill="none" stroke="transparent" stroke-width="16" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/><path class="vis" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path class="head" stroke-linejoin="round"/>';
    vec.appendChild(el);
  } else {
    el = document.createElement('div');
    el.dataset.id = it.id;
    el.className = 'item ' + it.type;
    el.innerHTML = '<div class="txt"></div>';
    itemsEl.appendChild(el);
  }
  els.set(it.id, el);
  return el;
}
function draw() {
  world.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.z})`;
  world.style.setProperty('--z', view.z);
  const gs = 24 * view.z;
  stage.style.setProperty('--gs', gs + 'px');
  stage.style.setProperty('--gx', (view.x % gs) + 'px');
  stage.style.setProperty('--gy', (view.y % gs) + 'px');
  $('#zoomLabel').textContent = Math.round(view.z * 100) + '%';

  const alive = new Set();
  for (const it of items) {
    alive.add(it.id);
    const el = els.get(it.id) || mkEl(it);
    if (it.type === 'pen' || it.type === 'arrow') drawVec(it, el);
    else {
      const f = fmt(it);
      el.style.cssText = `left:${it.x}px;top:${it.y}px;width:${it.w}px;height:${it.h}px;font-size:${f.fs}px;font-weight:${f.b ? 700 : 500};font-style:${f.i ? 'italic' : 'normal'};text-align:${f.al};justify-content:${JUSTIFY[f.al]};`;
      if (it.type !== 'text') el.style.background = colorOf(it.color);
      else el.style.minHeight = it.h + 'px';
      const t = el.firstChild;
      if (editingId !== it.id && t.textContent !== it.text) t.textContent = it.text || '';
    }
  }
  for (const [id, el] of els) if (!alive.has(id)) { el.remove(); els.delete(id); }
  // z-order follows array order for html items
  drawSelection();
}
function drawVec(it, el) {
  const vis = el.querySelector('.vis'), hit = el.querySelector('.hit'), head = el.querySelector('.head');
  const col = colorOf(it.color);
  let d;
  if (it.type === 'pen') {
    d = it.pts.length < 2 ? '' : 'M' + it.pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('L');
    if (it.pts.length === 1) d = `M${it.pts[0][0]} ${it.pts[0][1]}l.01 0`;
    head.setAttribute('d', '');
  } else {
    const a = endpoint(it, 'a'), b = endpoint(it, 'b');
    d = `M${a.x} ${a.y}L${b.x} ${b.y}`;
    const ang = Math.atan2(b.y - a.y, b.x - a.x), L = 16, W = Math.PI / 7;
    head.setAttribute('d', `M${b.x} ${b.y}L${b.x - L * Math.cos(ang - W)} ${b.y - L * Math.sin(ang - W)}L${b.x - L * Math.cos(ang + W)} ${b.y - L * Math.sin(ang + W)}Z`);
    head.setAttribute('fill', col); head.setAttribute('stroke', col);
  }
  vis.setAttribute('d', d); hit.setAttribute('d', d);
  vis.setAttribute('stroke', col);
  vis.setAttribute('stroke-width', it.type === 'pen' ? 3 : 2.5);
}
function drawSelection() {
  selEl.innerHTML = '';
  const list = [...sel].map(byId).filter(Boolean);
  const mk = (b, cls) => {
    const d = document.createElement('div');
    d.className = 'selbox ' + (cls || '');
    const pad = 4 / view.z;
    d.style.cssText = `left:${b.x - pad}px;top:${b.y - pad}px;width:${b.w + pad * 2}px;height:${b.h + pad * 2}px`;
    selEl.appendChild(d);
    return d;
  };
  for (const it of list) mk(bbox(it));
  if (list.length > 1) {
    const bs = list.map(bbox);
    const x1 = Math.min(...bs.map(b => b.x)), y1 = Math.min(...bs.map(b => b.y));
    const x2 = Math.max(...bs.map(b => b.x + b.w)), y2 = Math.max(...bs.map(b => b.y + b.h));
    mk({ x: x1 - 6 / view.z, y: y1 - 6 / view.z, w: x2 - x1 + 12 / view.z, h: y2 - y1 + 12 / view.z }, 'group');
  }
  if (list.length === 1 && ['sticky', 'rect', 'ellipse', 'text'].includes(list[0].type) && editingId !== list[0].id) {
    const h = document.createElement('div');
    h.className = 'handle'; h.dataset.handle = '1';
    selEl.lastChild.appendChild(h);
  }
  drawCtx(list);
}
function drawCtx(list) {
  const ctx = $('#ctx');
  if (!list.length) { ctx.classList.remove('show'); return; }

  else if (k === 'escape') { select([]); setTool('select'); }
  else if (k === 'enter' && sel.size === 1) { const it = byId([...sel][0]); if (it && it.type !== 'pen' && it.type !== 'arrow') { e.preventDefault(); startEdit(it.id); } }
  else if (e.shiftKey && (e.key === ')' || e.key === '0')) setZoom(1);
  else if (e.shiftKey && (e.key === '!' || e.key === '1')) fit();
  else if (!mod && (k === '+' || k === '=')) setZoom(view.z * 1.25);
  else if (!mod && (k === '-' || k === '_')) setZoom(view.z / 1.25);
  else if (!mod && KEYS[k]) setTool(KEYS[k]);
  else if (k.startsWith('arrow') && sel.size) {
    e.preventDefault(); pushUndo();
    const s = e.shiftKey ? 10 : 1, d = { arrowleft: [-s, 0], arrowright: [s, 0], arrowup: [0, -s], arrowdown: [0, s] }[k];
    for (const id of sel) moveItem(byId(id), d[0], d[1]);
    draw(); save();
  }
});
addEventListener('keyup', e => { if (e.code === 'Space') { spaceDown = false; stage.style.cursor = ''; } });
addEventListener('blur', () => { spaceDown = false; stage.style.cursor = ''; });
itemsEl.addEventListener('focusout', e => { if (e.target.classList.contains('txt')) endEdit(); });
itemsEl.addEventListener('input', e => {
  const it = byId(editingId); if (!it) return;
  if (it.type === 'text') { it.h = Math.max(32, e.target.scrollHeight + 8); els.get(it.id).style.minHeight = it.h + 'px'; drawSelection(); }
});
addEventListener('resize', draw);

/* ---------- boot ---------- */
if (!load()) {
  view = { x: innerWidth / 2 - 320, y: innerHeight / 2 - 200, z: 1 };
  items = [
    { id: uid(), type: 'text', x: 0, y: -10, w: 480, h: 44, color: 'ink', text: 'Добро пожаловать на доску' },
    { id: uid(), type: 'sticky', x: 0, y: 60, w: 200, h: 200, color: COLORS[0], text: 'Двойной клик по пустому месту — новый стикер' },
    { id: uid(), type: 'sticky', x: 260, y: 90, w: 200, h: 200, color: COLORS[3], text: 'Колесо — двигать, Ctrl + колесо — масштаб, пробел + drag — рука' },
    { id: uid(), type: 'sticky', x: 520, y: 60, w: 200, h: 200, color: COLORS[1], text: 'Фигуры, стрелки и карандаш — слева. Всё сохраняется в браузере' },
    { id: uid(), type: 'ellipse', x: 280, y: 360, w: 180, h: 110, color: COLORS[2], text: 'Идея' },
  ];
  const [, s1, , , e1] = items;
  items.push({ id: uid(), type: 'arrow', a: { id: s1.id, x: 0, y: 0 }, b: { id: e1.id, x: 0, y: 0 }, color: 'ink' });
}
setTool('select'); draw(); updateHistoryBtns();
})();
</script>
